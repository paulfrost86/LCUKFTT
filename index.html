<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Price Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; max-width: 480px; margin: 0 auto; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; }
    #result { margin-top: 20px; padding: 20px; border-radius: 12px; background: #f4f4f6; }
    .price { font-size: 2rem; font-weight: bold; color: #1b7a43; margin-top: 8px; }
    .name { font-size: 1.25rem; color: #222; margin: 0; }
    .discount-badge {
      display: inline-block;
      background-color: #d93025;
      color: #ffffff;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      margin-top: 10px;
    }
    .location {
      color: #681da8; /* Purple font */
      font-weight: 600;
      font-size: 1.1rem;
      margin-top: 12px;
    }
    .scan-again-btn {
      margin-top: 15px;
      background-color: #0b57d0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .error { color: #d93025; font-weight: 500; }
  </style>
</head>
<body>
  <h2>Barcode Price Lookup</h2>
  <div id="reader"></div>
  <div id="result">Loading product database...</div>

  <script>
    const catalog = {};
    let isCatalogLoaded = false;
    let html5QrcodeScanner = null;

    function normalizeBarcode(code) {
      return code ? code.replace(/^0+/, '').trim() : '';
    }

    // Fetch CSV with cache-busting timestamp
    fetch('products.csv?t=' + Date.now(), { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('Failed to load database file.');
        return res.text();
      })
      .then(csvText => {
        const cleanCsv = csvText.replace(/^\uFEFF/, '');
        const lines = cleanCsv.split(/\r?\n/);
        
        lines.forEach((line, index) => {
          const trimmedLine = line.trim();
          if (!trimmedLine) return;

          if (index === 0 && trimmedLine.toLowerCase().startsWith('barcode')) return;

          const columns = trimmedLine.split(',').map(col => col.replace(/^"|"$/g, '').trim());
          
          if (columns.length >= 3) {
            // Extract the 5th column (index 4) for location
            const [barcode, name, price, discount, location] = columns;
            const cleanCode = barcode.trim();
            const itemData = { 
              name, 
              price, 
              discount: discount || '',
              location: location || '' 
            };
            
            catalog[cleanCode] = itemData;
            catalog[normalizeBarcode(cleanCode)] = itemData;
          }
        });

        isCatalogLoaded = true;
        document.getElementById('result').innerText = 'Scan a product barcode using your camera';
      })
      .catch(err => {
        document.getElementById('result').innerHTML = `<p class="error">Error loading catalog. Check network or file setup.</p>`;
      });

    function onScanSuccess(decodedText) {
      const resultDiv = document.getElementById('result');

      if (!isCatalogLoaded) return;

      // Clean string thoroughly for iOS WebKit compatibility
      const cleanBarcode = decodedText.trim().replace(/[\r\n]+/g, '');
      const normalizedCode = normalizeBarcode(cleanBarcode);

      const item = catalog[cleanBarcode] || catalog[normalizedCode];
      
      if (item) {
        // Pause scanner immediately on iOS to prevent callback spam & UI freezing
        if (html5QrcodeScanner) {
          try {
            html5QrcodeScanner.pause(true);
          } catch (e) {}
        }

        const discountHTML = item.discount 
          ? `<div class="discount-badge">Promo: ${item.discount}</div>` 
          : '';
          
        const locationHTML = item.location
          ? `<div class="location">Loc ${item.location}</div>`
          : '';

        resultDiv.innerHTML = `
          <p class="name">${item.name}</p>
          <div class="price">£${item.price}</div>
          ${discountHTML}
          ${locationHTML}
          <br>
          <button class="scan-again-btn" onclick="resumeScanning()">Scan Next Item</button>
        `;
      } else {
        resultDiv.innerHTML = `<p>Item not found for barcode: <strong>${cleanBarcode}</strong></p>`;
      }
    }

    function resumeScanning() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = 'Scan a product barcode using your camera';
      if (html5QrcodeScanner) {
        try {
          html5QrcodeScanner.resume();
        } catch (e) {}
      }
    }

    window.addEventListener('load', () => {
      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        { fps: 10, qrbox: { width: 250, height: 150 } },
        /* verbose= */ false
      );
      html5QrcodeScanner.render(onScanSuccess);
    });
  </script>
</body>
</html>
