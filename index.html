<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Price Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; max-width: 480px; margin: 0 auto; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; }
    #result { margin-top: 20px; padding: 20px; border-radius: 12px; background: #f4f4f6; }
    .price { font-size: 2rem; font-weight: bold; color: #1b7a43; margin-top: 8px; }
    .name { font-size: 1.25rem; color: #222; margin: 0; }
    .discount-badge {
      display: inline-block;
      background-color: #d93025;
      color: #ffffff;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      margin-top: 10px;
      letter-spacing: 0.3px;
    }
    .error { color: #d93025; font-weight: 500; }
  </style>
</head>
<body>
  <h2>Barcode Price Lookup</h2>
  <div id="reader"></div>
  <div id="result">Scan a product barcode using your camera</div>

  <script>
    const catalog = {};

    // Fetch and parse CSV
    fetch('products.csv')
      .then(res => {
        if (!res.ok) throw new Error('Failed to load database file.');
        return res.text();
      })
      .then(csvText => {
        const lines = csvText.split(/\r?\n/);
        
        lines.forEach((line, index) => {
          const trimmedLine = line.trim();
          if (!trimmedLine) return; // Skip blank lines

          // Skip CSV header line
          if (index === 0 && trimmedLine.toLowerCase().startsWith('barcode')) return;

          // Standard split with quote removal
          const columns = trimmedLine.split(',').map(col => col.replace(/^"|"$/g, '').trim());
          
          if (columns.length >= 3) {
            const [barcode, name, price, discount] = columns;
            catalog[barcode] = { 
              name, 
              price, 
              discount: discount || '' 
            };
          }
        });
      })
      .catch(err => {
        document.getElementById('result').innerHTML = `<p class="error">Error loading product database. Ensure products.csv is present and served via HTTP/HTTPS.</p>`;
      });

    function onScanSuccess(decodedText) {
      const cleanBarcode = decodedText.trim();
      const item = catalog[cleanBarcode];
      const resultDiv = document.getElementById('result');
      
      if (item) {
        // Build discount badge markup if a discount exists
        const discountHTML = item.discount 
          ? `<div class="discount-badge">Promo: ${item.discount}</div>` 
          : '';

        resultDiv.innerHTML = `
          <p class="name">${item.name}</p>
          <div class="price">£${item.price}</div>
          ${discountHTML}
        `;
      } else {
        resultDiv.innerHTML = `<p>Item not found for barcode: <strong>${cleanBarcode}</strong></p>`;
      }
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      { fps: 10, qrbox: { width: 250, height: 150 } },
      /* verbose= */ false
    );
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
